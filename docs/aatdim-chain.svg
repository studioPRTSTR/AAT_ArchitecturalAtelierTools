<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 370" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="1040" height="370" fill="#ffffff"/>
<text x="20" y="28" fill="#222" font-weight="bold" font-size="16">AATDim – multi-row dimension chain (selected)</text>

<!-- wall with a door opening -->
<rect x="110" y="62" width="128" height="28" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<rect x="398" y="62" width="232" height="28" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<path d="M238,90 A160,160 0 0 1 398,62" fill="none" stroke="#999" stroke-dasharray="4 3"/>
<line x1="238" y1="62" x2="238" y2="90" stroke="#999" stroke-dasharray="4 3"/>
<text x="280" y="54" fill="#999" font-size="11">door</text>

<!-- extension lines -->
<g stroke="#555" stroke-width="1">
  <line x1="110" y1="94" x2="110" y2="236"/>
  <line x1="238" y1="94" x2="238" y2="156"/>
  <line x1="398" y1="94" x2="398" y2="196"/>
  <line x1="630" y1="94" x2="630" y2="236"/>
</g>

<!-- dimension lines with ticks -->
<g stroke="#222" stroke-width="1.3">
  <line x1="104" y1="150" x2="636" y2="150"/>
  <line x1="104" y1="190" x2="636" y2="190"/>
  <line x1="104" y1="230" x2="636" y2="230"/>
</g>
<g stroke="#222" stroke-width="2">
  <line x1="105" y1="155" x2="115" y2="145"/><line x1="233" y1="155" x2="243" y2="145"/>
  <line x1="393" y1="155" x2="403" y2="145"/><line x1="625" y1="155" x2="635" y2="145"/>
  <line x1="105" y1="195" x2="115" y2="185"/><line x1="393" y1="195" x2="403" y2="185"/>
  <line x1="625" y1="195" x2="635" y2="185"/>
  <line x1="105" y1="235" x2="115" y2="225"/><line x1="625" y1="235" x2="635" y2="225"/>
</g>

<!-- dimension texts -->
<g fill="#222" font-size="13" text-anchor="middle">
  <text x="174" y="144">80</text>
  <text x="318" y="144">1.00</text>
  <text x="514" y="144">1.45</text>
  <text x="254" y="184">1.80</text>
  <text x="514" y="184">1.45</text>
  <text x="370" y="224">3.25</text>
</g>
<text x="318" y="166" fill="#222" font-size="11" text-anchor="middle">RPH 2.10</text>

<!-- row labels -->
<g fill="#888" font-size="11">
  <text x="646" y="154">row 1</text>
  <text x="646" y="194">row 2</text>
  <text x="646" y="234">row 3 (overall)</text>
</g>

<!-- buttons -->
<g font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">
  <!-- move point: on every measure point -->
  <rect x="98" y="82" width="24" height="16" rx="8" fill="#289650"/><text x="110" y="94">&lt;&gt;</text>
  <rect x="226" y="82" width="24" height="16" rx="8" fill="#289650"/><text x="238" y="94">&lt;&gt;</text>
  <rect x="386" y="82" width="24" height="16" rx="8" fill="#289650"/><text x="398" y="94">&lt;&gt;</text>
  <rect x="618" y="82" width="24" height="16" rx="8" fill="#289650"/><text x="630" y="94">&lt;&gt;</text>

  <!-- merge: on inner points of each row -->
  <rect x="230" y="142" width="16" height="16" rx="8" fill="#c83c32"/><text x="238" y="154">x</text>
  <rect x="390" y="142" width="16" height="16" rx="8" fill="#c83c32"/><text x="398" y="154">x</text>
  <rect x="390" y="182" width="16" height="16" rx="8" fill="#c83c32"/><text x="398" y="194">x</text>

  <!-- text below: next to each dimension text -->
  <rect x="188" y="131" width="16" height="16" rx="8" fill="#e68c1e"/><text x="196" y="143">+</text>
  <rect x="340" y="131" width="16" height="16" rx="8" fill="#e68c1e"/><text x="348" y="143">T</text>
  <rect x="536" y="131" width="16" height="16" rx="8" fill="#e68c1e"/><text x="544" y="143">+</text>
  <rect x="276" y="171" width="16" height="16" rx="8" fill="#e68c1e"/><text x="284" y="183">+</text>
  <rect x="536" y="171" width="16" height="16" rx="8" fill="#e68c1e"/><text x="544" y="183">+</text>
  <rect x="392" y="211" width="16" height="16" rx="8" fill="#e68c1e"/><text x="400" y="223">+</text>

  <!-- side buttons: menu, delete row, add row -->
  <rect x="14" y="142" width="26" height="16" rx="8" fill="#282828"/><text x="27" y="154">...</text>
  <rect x="46" y="142" width="16" height="16" rx="8" fill="#6e6e6e"/><text x="54" y="154">-</text>
  <rect x="46" y="182" width="16" height="16" rx="8" fill="#6e6e6e"/><text x="54" y="194">-</text>
  <rect x="46" y="222" width="16" height="16" rx="8" fill="#6e6e6e"/><text x="54" y="234">-</text>
  <rect x="46" y="262" width="16" height="16" rx="8" fill="#2f6fdc"/><text x="54" y="274">+</text>
</g>
<line x1="70" y1="270" x2="636" y2="270" stroke="#2f6fdc" stroke-dasharray="6 4"/>
<text x="110" y="290" fill="#2f6fdc" font-size="11">next row goes here (one row spacing further out)</text>

<!-- format note -->
<text x="110" y="330" fill="#555" font-size="12">Below 1 m in cm: 80  ·  from 1 m in m: 1.00  ·  every row shares the measure points</text>
<text x="110" y="350" fill="#555" font-size="12">Rows are spaced by the row spacing (7 mm on paper, change it in the  ...  menu)</text>

<!-- legend -->
<g transform="translate(750,60)">
  <text x="0" y="0" fill="#222" font-weight="bold">Buttons</text>
  <g font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">
    <rect x="0" y="16" width="24" height="16" rx="8" fill="#289650"/><text x="12" y="28">&lt;&gt;</text>
    <rect x="4" y="60" width="16" height="16" rx="8" fill="#c83c32"/><text x="12" y="72">x</text>
    <rect x="4" y="104" width="16" height="16" rx="8" fill="#e68c1e"/><text x="12" y="116">+</text>
    <rect x="4" y="148" width="16" height="16" rx="8" fill="#6e6e6e"/><text x="12" y="160">-</text>
    <rect x="4" y="192" width="16" height="16" rx="8" fill="#2f6fdc"/><text x="12" y="204">+</text>
    <rect x="0" y="236" width="24" height="16" rx="8" fill="#282828"/><text x="12" y="248">...</text>
  </g>
  <g fill="#222" font-size="12">
    <text x="34" y="28" font-weight="bold">Move point</text>
    <text x="34" y="44" fill="#555">click, then click the new spot – all rows follow</text>
    <text x="34" y="72" font-weight="bold">Merge</text>
    <text x="34" y="88" fill="#555">remove the point from this row – one long dim</text>
    <text x="34" y="116" font-weight="bold">Text below (T = edit)</text>
    <text x="34" y="132" fill="#555">e.g. RPH 2.10 under the door width</text>
    <text x="34" y="160" font-weight="bold">Delete row</text>
    <text x="34" y="176" fill="#555">removes this dimension line</text>
    <text x="34" y="204" font-weight="bold">Add row</text>
    <text x="34" y="220" fill="#555">new row with all points, further out</text>
    <text x="34" y="248" font-weight="bold">Menu</text>
    <text x="34" y="264" fill="#555">row spacing and all texts below</text>
  </g>
</g>
</svg>
